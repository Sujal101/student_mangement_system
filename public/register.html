<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Sign up to use the Student Management System</p>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Choose a username">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Choose a password">
                </div>
                
                <button type="submit" class="btn-primary">Register</button>
            </form>
            
            <p class="auth-redirect">Already have an account? <a href="index.html">Login here</a></p>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message" style="color: #28a745; text-align: center; margin-top: 10px; font-size: 13px;"></div>
        </div>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
